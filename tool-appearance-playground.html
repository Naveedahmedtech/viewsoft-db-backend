<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Appearance Playground</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1f2933;
      --muted: #6b7785;
      --line: #d9e2ec;
      --accent: #0f6cbd;
      --accent-soft: #e6f1fb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(160deg, #eef3f8 0%, #f8fafc 100%);
      color: var(--ink);
    }

    .wrap {
      max-width: 980px;
      margin: 32px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 10px;
    }

    .tools {
      display: grid;
      gap: 8px;
    }

    .tool-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
    }

    .tool-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row:last-child { margin-bottom: 0; }
    label { font-size: 13px; color: var(--muted); }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -4px;
      margin-bottom: 10px;
    }

    .hidden { display: none; }

    .preview {
      margin-top: 10px;
      padding: 14px;
      border-radius: 10px;
      border: 1px dashed #bfd2e3;
      background: #f8fbff;
      min-height: 90px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="panel">
      <h1>Tools</h1>
      <div class="tools">
        <button class="tool-btn active" data-tool="collab">Collab</button>
        <button class="tool-btn" data-tool="text">Text</button>
        <button class="tool-btn" data-tool="callout">Callout</button>
      </div>
    </aside>

    <main class="panel">
      <h1>Appearance Settings</h1>

      <section class="section">
        <h2>Global Appearance</h2>
        <div class="row">
          <label for="strokeColor">Stroke Color</label>
          <input id="strokeColor" type="color" value="#0f6cbd">
        </div>
        <div class="row">
          <label for="fillColor">Fill Color</label>
          <input id="fillColor" type="color" value="#ffffff">
        </div>
        <div class="row">
          <label for="thickness">Line Thickness</label>
          <input id="thickness" type="range" min="1" max="12" value="2">
        </div>
      </section>

      <section id="textFontStyleSection" class="section hidden">
        <h2>Text Font Style</h2>
        <p class="hint">Visible when selecting Text or Callout tools.</p>
        <div class="row">
          <label for="fontFamily">Font Family</label>
          <select id="fontFamily">
            <option>Segoe UI</option>
            <option>Arial</option>
            <option>Times New Roman</option>
            <option>Courier New</option>
          </select>
        </div>
        <div class="row">
          <label for="fontSize">Font Size</label>
          <input id="fontSize" type="number" value="14" min="8" max="72">
        </div>
        <div class="row">
          <label for="fontWeight">Font Weight</label>
          <select id="fontWeight">
            <option>400</option>
            <option>500</option>
            <option>600</option>
            <option>700</option>
          </select>
        </div>
      </section>

      <section class="section">
        <h2>Current Selection</h2>
        <div class="preview" id="preview">
          Active tool: <strong>Collab</strong>
        </div>
      </section>
    </main>
  </div>

  <script>
    const toolButtons = Array.from(document.querySelectorAll(".tool-btn"));
    const textFontStyleSection = document.getElementById("textFontStyleSection");
    const preview = document.getElementById("preview");

    function updateToolSelection(tool) {
      toolButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tool === tool);
      });

      const showTextStyle = tool === "text" || tool === "callout";
      textFontStyleSection.classList.toggle("hidden", !showTextStyle);
      preview.innerHTML = "Active tool: <strong>" + tool.charAt(0).toUpperCase() + tool.slice(1) + "</strong>";
    }

    toolButtons.forEach((btn) => {
      btn.addEventListener("click", () => updateToolSelection(btn.dataset.tool));
    });

    updateToolSelection("collab");
  </script>
</body>
</html>
